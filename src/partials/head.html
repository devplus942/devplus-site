<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}"/>
<meta name="robots" content="index, follow"/>
<link rel="canonical" href="{{CANONICAL}}"/>

<!-- Open Graph -->
<meta property="og:type" content="website"/>
<meta property="og:site_name" content="DevPlus+"/>
<meta property="og:title" content="{{TITLE}}"/>
<meta property="og:description" content="{{DESC}}"/>
<meta property="og:url" content="{{CANONICAL}}"/>
<meta property="og:image" content="{{SITE_URL}}/assets/logo.png"/>

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:title" content="{{TITLE}}"/>
<meta name="twitter:description" content="{{DESC}}"/>
<meta name="twitter:image" content="{{SITE_URL}}/assets/logo.png"/>

<link rel="icon" href="assets/logo.png" type="image/png"/>
<link rel="apple-touch-icon" href="assets/logo.png"/>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
